name: CI pipeline
on: 
  push: 
    branches: [ "main" ]

jobs: 
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: Login to dockerhub
        run: echo "docker login -u ${{ secrets.docker_username }} --p ${{ secrets.docker_password }}"

      - name: Testing username
        run: echo "Username is ${{ secrets.DOCKER_USERNAME }}"
  
      - name: build and push user image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/user:latest ./script
          docker push ${{ secrets.DOCKER_USERNAME }}/user:latest ./script
    
      - name: build and push cart image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cart:latest ./cart
          docker push ${{ secrets.DOCKER_USERNAME }}/cart:latest ./cart

      - name: apply kubectl configs
        run: |
          kubectl apply -f .

      - name: restart deployments
        run: |
          kubectl rollout restart deployment user-deployment
          kubectl rollout restart deployment cart-deployment

      - name: verify
        run: |
          kubectl get pods 
          kubectl get svc





