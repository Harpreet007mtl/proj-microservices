name: CI pipeline
on: 
  push: 
    branches: [ "main" ]

jobs: 
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: Login to dockerhub
        run: echo "docker login -u ${{ secrets.DOCKER_USERNAME }} --p ${{ secrets.DOCKER_PASSWORD }}"

      - name: Test login manually
        run: |
          echo "Logging in..."
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker info
  
      - name: build and push user image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/user:latest ./src/script
          docker push ${{ secrets.DOCKER_USERNAME }}/user:latest 
    
      - name: build and push cart image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cart:latest ./src/cart
          docker push ${{ secrets.DOCKER_USERNAME }}/cart:latest 
      - name: apply kubectl configs
        run: |
          kubectl apply -f ./src/script/
          kubectl apply -f ./src/cart/

      - name: restart deployments
        run: |
          kubectl rollout restart deployment user-deployment
          kubectl rollout restart deployment cart-deployment

      - name: verify
        run: |
          kubectl get pods 
          kubectl get svc





