name: CI pipeline
on: 
  push: 
    branches:[ "main"]

jobs: 
  build and deploy:
    runs-on: ubuntu-latest
  steps:
  - name: checkout code
    uses: actions/checkout@v3

  - name: Login to dockerhub
    runs: echo "docker login -u ${{secret.docker_username}} --p ${{secret.docker_password}}"
  
  - name: build and push user image
    runs: |
     docker build -t user:latest ./script
     docker push -t  user:latest ./script
    
  - name: build and push cart image
    runs: |
    docker build -t cart:latest ./cart
    docker push -t cart:latest ./cart

  - name: apply kubectl configs
    runs: |
    kubectl apply -f .

  - name: restart deployments
    runs: |
    kubectl rollout restart deployment user-deployment
    kubectl rollout restart deployment cart-deployment

  - name: verify
    runs: |
    kubectl get pods 
    kubectl get svc





