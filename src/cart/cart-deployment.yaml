apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      containers:
      - name: cart
        image: harpreet007mtl@gmail.com/cart:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5001