apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
  labels:
    app: user
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
      - name: user
        image: arpreet007mtl@gmail.com/user-deployment
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
